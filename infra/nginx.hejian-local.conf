events {}

http {
  upstream hejian_phase2 {
    server phase2-api:10020;
  }
  server {
    listen 8080;
    client_max_body_size 32m;
    location /api/v2/ {
      proxy_pass http://hejian_phase2;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }
    location /assets/ {
      proxy_pass http://hejian_phase2;
      proxy_set_header Host $host;
    }
    location / {
      return 404;
    }
  }
}
