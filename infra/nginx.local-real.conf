# Docker services can change IP when switching from offline to real calls.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream local_phase2 { zone local_phase2 64k; server phase2-api:10020 resolve; }
upstream local_file { zone local_file 64k; server file:10004 resolve; }
# Never point a public tunnel at port 8080.
server {
  listen 8080;
    client_max_body_size 512m;
    location /api/v2/ {
      proxy_pass http://local_phase2;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }
  location /assets/ { proxy_pass http://local_phase2; }
  location / { return 404; }
}
# Public tunnel target: 127.0.0.1:8081. Token-scoped GET/HEAD media only.
server {
  listen 8081;
  access_log off;
  location = /media/${LOCAL_MEDIA_TOKEN}/ready {
    limit_except GET { deny all; }
    proxy_pass http://local_phase2/api/v2/media-ready;
  }
  location /media/${LOCAL_MEDIA_TOKEN}/assets/ {
    limit_except GET { deny all; }
    proxy_pass http://local_phase2/assets/;
  }
  location /media/${LOCAL_MEDIA_TOKEN}/api/v2/assets/ {
    limit_except GET { deny all; }
    proxy_pass http://local_phase2/api/v2/assets/;
  }
  location /media/${LOCAL_MEDIA_TOKEN}/aitravel/api/v1/file/download/ {
    limit_except GET { deny all; }
    proxy_pass http://local_file/api/v1/file/download/;
  }
  location / { return 404; }
}
