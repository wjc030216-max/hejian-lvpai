events {}
http {
  upstream phase2_api { server phase2-api:10020; }
  server {
    listen 8080;
    client_max_body_size 32m;
    location /api/v2/ { proxy_pass http://phase2_api; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; }
    location /assets/ { proxy_pass http://phase2_api; proxy_set_header Host $host; }
    location /api/v2/health { proxy_pass http://phase2_api; }
    location / { return 404; }
  }
}
